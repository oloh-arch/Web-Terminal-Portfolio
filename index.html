<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stephan Messi Oloo | Web Terminal Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="terminal" id="terminal" aria-label="Interactive Portfolio Terminal">
    <div id="output" class="output"></div>
    <div class="input-line">
      <span class="prompt">stephan@portfolio:~$</span>
      <input
        type="text"
        id="command-input"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        autofocus
        aria-label="Terminal command input"
      />
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
